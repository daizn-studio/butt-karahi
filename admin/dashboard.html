<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data: https:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Dashboard — Butt Karahi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700;800&family=Great+Vibes&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/motion.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <div class="admin-topbar__inner">
    <div class="logo"><span class="brand"><span class="brand__butt">Butt</span><span class="brand__reg" aria-hidden="true">&reg;</span> <span class="brand__karahi">Karahi</span></span> <small style="color:var(--muted);font-family:var(--font-body);text-transform:none;">/ admin</small></div>
    <button class="btn btn-outline" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="admin-shell">
  <div class="admin-tabs">
    <button class="admin-tab is-active" data-panel="menuPanel">Menu</button>
    <button class="admin-tab" data-panel="ordersPanel">Orders</button>
  </div>

  <section class="admin-panel is-active" id="menuPanel">
    <div class="admin-panel-head">
      <h2>Menu items</h2>
      <button class="btn btn-primary" id="addItemBtn">+ Add item</button>
    </div>
    <div class="admin-table-wrap" id="menuTableWrap"></div>
  </section>

  <section class="admin-panel" id="ordersPanel">
    <div class="admin-panel-head">
      <h2>Orders</h2>
      <button class="btn btn-outline" id="refreshOrdersBtn">Refresh</button>
    </div>
    <div class="admin-table-wrap" id="ordersTableWrap"></div>
  </section>
</div>

<!-- Add/edit menu item modal -->
<div class="modal-overlay" id="itemModalOverlay" hidden>
  <div class="modal-card">
    <h3 id="itemModalTitle">Add item</h3>
    <form id="itemForm">
      <div class="field">
        <label for="itemName">Name</label>
        <input type="text" id="itemName" required>
      </div>
      <div class="field">
        <label for="itemDescription">Description</label>
        <textarea id="itemDescription"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="itemPrice">Price (Rs)</label>
          <input type="number" id="itemPrice" min="0" step="1" placeholder="Leave blank if sizes set">
        </div>
        <div class="field">
          <label for="itemCategory">Category</label>
          <!-- Filled from MENU_CATEGORY_ORDER in js/menu-data.js -->
          <select id="itemCategory"></select>
        </div>
      </div>
      <div class="field">
        <label for="itemSizes">Sizes (optional)</label>
        <input type="text" id="itemSizes" placeholder="Half = 1550, Full = 2800">
        <div class="field-error" id="itemSizesError" role="alert"></div>
      </div>
      <div class="field">
        <label for="itemImageUrl">Image URL</label>
        <input type="text" id="itemImageUrl" placeholder="https://…">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="itemSortOrder">Sort order</label>
          <input type="number" id="itemSortOrder" step="1" value="0">
        </div>
        <div class="checkbox-field field">
          <input type="checkbox" id="itemAvailable" checked>
          <label for="itemAvailable">Available</label>
        </div>
      </div>
      <div class="checkbox-field field">
        <input type="checkbox" id="itemPopular">
        <label for="itemPopular">Show in "Popular" tab</label>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-outline" id="itemCancelBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/menu-data.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
